name: Rebuild on Push

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      window:
        description: "How many of the newest upstream bNNNN builds to keep/rebuild"
        required: false
        default: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04

    steps:
      - name: Calculate recent window and dispatch new builds
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            // RECENT WINDOW: keep/rebuild only the newest N upstream bNNNN builds. Upstream llama.cpp has no
            // "major" releases — it cuts bNNNN build tags ~7-8x/day — so a bounded recent window is the right
            // strategy (full history is unbounded and re-storms the queue on every push). Incremental: build
            // only window tags we don't already have; prune only releases that have fallen out of the window.
            const WINDOW = parseInt(context.payload.inputs?.window || '20', 10);

            // 1) The recent window = newest N upstream bNNNN tags (listReleases returns newest-first).
            console.log(`Computing recent window: newest ${WINDOW} upstream bNNNN builds...`);
            const { data: upstream } = await github.rest.repos.listReleases({
              owner: 'ggml-org', repo: 'llama.cpp', per_page: 100, page: 1,
            });
            const windowTags = upstream
              .map(r => r.tag_name)
              .filter(t => /^b[0-9]+$/.test(t))
              .sort((a, b) => parseInt(b.slice(1)) - parseInt(a.slice(1)))
              .slice(0, WINDOW);
            if (windowTags.length === 0) { console.log('No upstream bNNNN tags found; nothing to do.'); return; }
            const windowSet = new Set(windowTags);
            console.log(`Window (${windowTags.length}): ${windowTags.join(', ')}`);

            // 2) What we already have (our bNNNN-ork releases).
            const ourReleases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const haveTags = new Set(
              ourReleases.map(r => r.tag_name.replace(/-ork$/, '')).filter(t => /^b[0-9]+$/.test(t))
            );

            // 3) PRUNE only what has fallen OUT of the window (release + its tag). No delete-all.
            for (const rel of ourReleases) {
              const base = rel.tag_name.replace(/-ork$/, '');
              if (!/^b[0-9]+$/.test(base) || windowSet.has(base)) continue;
              console.log(`Pruning out-of-window release ${rel.tag_name}`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id });
              } catch (e) { console.error(`  delete release ${rel.tag_name}: ${e.message}`); }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${rel.tag_name}` });
              } catch (e) { console.warn(`  delete tag ${rel.tag_name}: ${e.message}`); }
            }

            // 4) DISPATCH only window builds we don't already have (typically 0-few per push -> no storm).
            async function dispatch(tag, ourTag) {
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner, repo: context.repo.repo,
                    workflow_id: 'build-rockchip.yml', ref: 'master',
                    inputs: { upstream_tag: tag, our_tag: ourTag },
                  });
                  return;
                } catch (e) {
                  console.warn(`Dispatch ${ourTag} attempt ${attempt + 1} failed: ${e.message}`);
                  if (attempt < 2) await sleep(5000 * (attempt + 1));
                }
              }
              console.error(`Failed to dispatch ${ourTag} after 3 attempts`);
            }

            const toBuild = windowTags.filter(t => !haveTags.has(t));
            console.log(`New builds to dispatch: ${toBuild.length ? toBuild.join(', ') : '(none — already up to date)'}`);
            for (const tag of toBuild) {
              const ourTag = `${tag}-ork`;
              console.log(`Dispatching builder for ${ourTag}...`);
              await dispatch(tag, ourTag);
              await sleep(2000);
            }
